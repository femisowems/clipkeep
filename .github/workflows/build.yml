name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ClipKeep.app
        run: bash ./build.sh
      - name: Package app
        run: ditto -c -k --keepParent ClipKeep.app ClipKeep.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ClipKeep-app
          path: ClipKeep.zip
          if-no-files-found: error
